services:
  whisper:
    build: .
    image: whisper-cuda:latest
    container_name: whisper_batch_container
    volumes:
      - /home/marcel/Dokumente/Aufnahmen:/in
      - /home/marcel/Dokumente/Aufnahmen/Transkriptionen:/out
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]